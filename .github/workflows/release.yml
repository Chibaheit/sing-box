name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a version tag such as v1.13.0 or v1.13.0-beta.1" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi
          name="sing-box-${version}-${GOOS}-${GOARCH}"
          binary=sing-box
          if [[ "$GOOS" == "windows" ]]; then
            binary=sing-box.exe
          fi
          mkdir -p "dist/$name"
          go build -v -trimpath \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$version $(cat release/LDFLAGS) -s -w -buildid=" \
            -o "dist/$name/$binary" ./cmd/sing-box
          cp LICENSE "dist/$name/"
          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            "dist/$name/$binary" version
          fi
          if [[ "$GOOS" == "windows" ]]; then
            (cd dist && zip -r "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v5
        with:
          pattern: sing-box-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          gh release create "$tag" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --prerelease \
            --notes "Unofficial CLI builds from $GITHUB_REPOSITORY at $GITHUB_SHA. Includes the features in release/DEFAULT_BUILD_TAGS_OTHERS (including Tailscale); excludes NaiveProxy. These are command-line binaries, not Android or Apple GUI applications. Verify downloads with SHA256SUMS."
