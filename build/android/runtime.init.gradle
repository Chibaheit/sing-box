import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact
import org.gradle.jvm.JvmLibrary
import org.gradle.language.base.artifact.SourcesArtifact

// This task reads the same Configuration objects that assemble has consumed.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Provenance requires :app')
    def out = new File(app.layout.buildDirectory.get().asFile, 'runtime-provenance')
    def validator = new File(gradle.startParameter.initScripts.find {
        it.name == 'runtime.init.gradle'
    }.parentFile, 'runtime_provenance.py')
    def validate = { mode ->
        def child = app.providers.exec {
            commandLine 'python3', validator.absolutePath, mode, out.absolutePath
            ignoreExitValue = true
        }
        if (child.result.get().exitValue != 0) {
            def diagnostic = [schema: 1, phase: mode == '--prepare' ? 'prepare' : 'invocation',
                              reason: 'child_failure', field: 'capture']
            byte[] bytes = child.standardError.asBytes.get()
            if (bytes.length <= 1024) {
                try {
                    def value = new JsonSlurper().parseText(new String(bytes, 'UTF-8'))
                    def integer = { n ->
                        (n instanceof Integer || n instanceof Long || n instanceof BigInteger) &&
                            n >= 0 && n <= Long.MAX_VALUE
                    }
                    def budgets = ['archive_members', 'capture_members', 'member_bytes', 'archive_bytes',
                        'capture_bytes', 'evidence_bytes', 'notice_member_bytes', 'notice_bytes',
                        'graph_bytes', 'archive_depth', 'archive_directory_bytes', 'capture_directory_bytes']
                    def keys = ['schema', 'phase', 'reason', 'field', 'index', 'sha256', 'budget', 'count', 'limit']
                    if (value instanceof Map && value.keySet().every { it in keys } &&
                        value.schema instanceof Integer && value.schema == 1 &&
                        value.phase in ['invocation', 'prepare', 'limits', 'graph_read', 'graph_scan',
                            'graph_decode', 'entry', 'raw_scan', 'zip_inspection', 'publication'] &&
                        value.reason in ['invalid_input', 'io_error', 'unexpected_error', 'invalid_zip',
                            'credential_url', 'unparseable_url', 'budget_exceeded'] &&
                        value.field in ['capture', 'graph', 'required_artifacts', 'supplements'] &&
                        (!value.containsKey('index') || integer(value.index)) &&
                        (!value.containsKey('sha256') ||
                            (value.sha256 instanceof String && value.sha256 ==~ /[0-9a-f]{64}/)) &&
                        (value.reason == 'budget_exceeded' ?
                            (value.budget in budgets && integer(value.count) && integer(value.limit) &&
                                value.limit > 0 && value.count >= value.limit) :
                            !['budget', 'count', 'limit'].any { value.containsKey(it) }) &&
                        // Reject trailing text, duplicate keys, alternate encodings and extra output.
                        JsonOutput.toJson(value) == new String(bytes, 'UTF-8').trim()) {
                        diagnostic = value
                    }
                } catch (Exception ignored) {
                    // Child output is untrusted; even parser exceptions stay private.
                }
            }
            app.logger.error('RUNTIME_DIAGNOSTIC ' + JsonOutput.toJson(diagnostic))
            throw new GradleException('Runtime evidence validation failed; no public graph published')
        }
    }
    // Invalidate only owned graphs, after checking ancestors; never delete a tree.
    validate('--prepare')
    app.tasks.register('captureOtherReleaseProvenance') {
        dependsOn ':app:assembleOtherRelease'
        doLast {
            out.mkdirs()
            def safePath = { File file ->
                def path = file.toPath().toAbsolutePath()
                while (path != null) {
                    if (java.nio.file.Files.isSymbolicLink(path))
                        throw new GradleException('Provenance path has symlink ancestor')
                    path = path.parent
                }
            }
            def sha = { File file ->
                safePath(file)
                def digest = MessageDigest.getInstance('SHA-256')
                file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                digest.digest().encodeHex().toString()
            }
            def retain = { File file ->
                if (!file.isFile() || java.nio.file.Files.isSymbolicLink(file.toPath()))
                    throw new GradleException('Invalid provenance artifact')
                def hash = sha(file)
                def target = new File(out, "files/${hash}")
                safePath(target)
                target.parentFile.mkdirs()
                if (!target.exists()) file.withInputStream { input ->
                    target.withOutputStream { output -> output << input }
                }
                [sha256: hash, size: file.length(), file: "files/${hash}"]
            }
            def attributes = { attrs ->
                attrs.keySet().collectEntries { key -> [(key.name): attrs.getAttribute(key).toString()] }
            }
            def identity = { id ->
                id instanceof ModuleComponentIdentifier ?
                    "${id.group}:${id.module}:${id.version}".toString() :
                    (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier ?
                        "project:${id.projectPath}".toString() : 'local-file')
            }
            def input = { File file, id ->
                def local = ['libbox.aar': 'local:libbox', 'libbox-legacy.aar': 'local:libbox-legacy']
                def selected = id instanceof ModuleComponentIdentifier ? identity(id) :
                    (local.containsKey(file.name) && file.canonicalFile ==
                        new File(app.projectDir, "libs/${file.name}").canonicalFile ? local[file.name] : null)
                if (selected == null) throw new GradleException('Unknown local runtime artifact')
                [component: selected, sha256: sha(file), size: file.length(),
                 type: file.name.tokenize('.').last()]
            }
            def record = [schema: 2, mode: app.findProperty('provenanceFixture') == 'true' ? 'fixture' : 'build',
                gradle: gradle.gradleVersion, assemble_task: ':app:assembleOtherRelease',
                configurations: [:], supplements: [], supplemental_missing: []]
            def configs = app.configurations.findAll {
                it.canBeResolved && (it.name == 'otherReleaseRuntimeClasspath' ||
                    it.name.toLowerCase().contains('corelibrarydesugaring'))
            }
            if (!configs.any { it.name == 'otherReleaseRuntimeClasspath' } ||
                !configs.any { it.name.toLowerCase().contains('corelibrarydesugaring') })
                throw new GradleException('Required runtime/desugaring configuration missing')
            def modules = new LinkedHashSet()
            configs.each { config ->
                if (config.state == org.gradle.api.artifacts.Configuration.State.UNRESOLVED)
                    throw new GradleException('Required configuration was not consumed by assemble; refusing a new resolution')
                def resolution = config.incoming.resolutionResult
                def components = resolution.allComponents.collect { component ->
                    if (component.id instanceof ModuleComponentIdentifier) modules.add(component.id)
                    [id: identity(component.id), variants: component.variants.collect { variant ->
                        [name: variant.displayName, attributes: attributes(variant.attributes),
                         capabilities: variant.capabilities.collect { "${it.group}:${it.name}:${it.version}".toString() }]
                    }]
                }
                def edges = resolution.allDependencies.collect { edge ->
                    if (!(edge instanceof ResolvedDependencyResult))
                        throw new GradleException('Unresolved runtime dependency; capture incomplete')
                    [from: identity(edge.from.id), requested: edge.requested.displayName,
                     selected: identity(edge.selected.id), constraint: edge.constraint,
                     variant: [name: edge.resolvedVariant.displayName,
                               attributes: attributes(edge.resolvedVariant.attributes)]]
                }
                def artifacts = config.incoming.artifacts.artifacts.collect { artifact ->
                    input(artifact.file, artifact.id.componentIdentifier) +
                        [attributes: attributes(artifact.variant.attributes)]
                }
                if (artifacts.empty) throw new GradleException('Required configuration has no artifacts')
                record.configurations[config.name] = [components: components, edges: edges, artifacts: artifacts]
            }
            // Supplement queries never supply or replace the runtime graph.
            modules.each { module ->
                if (![module.group, module.module, module.version].every { it ==~ /[A-Za-z0-9_.+-]+/ } ||
                    [module.group, module.module, module.version].any { it == '.' || it == '..' })
                    throw new GradleException('Unsafe Maven cache coordinate')
                [[MavenModule, MavenPomArtifact, 'pom'], [JvmLibrary, SourcesArtifact, 'sources']].each { kind ->
                    def result = app.dependencies.createArtifactResolutionQuery().forComponents(module)
                        .withArtifacts(kind[0], kind[1]).execute()
                    def found = []
                    result.resolvedComponents.each { component ->
                        component.getArtifacts(kind[1]).each { artifact ->
                            if (artifact instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult)
                                found.add(retain(artifact.file) + [component: identity(module), kind: kind[2]])
                        }
                    }
                    record.supplements.addAll(found)
                    if (found.empty) record.supplemental_missing.add([component: identity(module),
                        kind: kind[2], reason: 'unavailable'])
                }
                // Gradle files-2.1 stores downloaded module metadata, not metadata-* binary indexes.
                def cache = new File(gradle.gradleUserHomeDir,
                    "caches/modules-2/files-2.1/${module.group}/${module.module}/${module.version}")
                def metadata = []
                if (cache.isDirectory()) cache.eachDir { hashDir ->
                    hashDir.eachFile { file ->
                        if (file.name == "${module.module}-${module.version}.module")
                            metadata.add(retain(file) + [component: identity(module), kind: 'module'])
                    }
                }
                record.supplements.addAll(metadata)
                if (metadata.empty) record.supplemental_missing.add([component: identity(module),
                    kind: 'module', reason: 'unavailable'])
            }
            record.local_aars = ['libbox.aar', 'libbox-legacy.aar'].collect {
                new File(app.projectDir, "libs/${it}")
            }.findAll { it.isFile() }.collect { input(it, null) }
            if (!record.local_aars.any { it.component == 'local:libbox' })
                throw new GradleException('Required local libbox.aar missing')
            new File(out, 'graph.pending.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(record)) + '\n'
            validate('--sanitize')
        }
    }
}
